    // 遍历处对稀疏槽位已有判空，点击未建槽位时 triggerPlayCeremony 也有全量兜底
    let pendingBuilds = [];

    // 中心跨卡后移动固定窗口；移除远处实体与 GPU 纹理，回滑时按需重建。
    function ensureQueueWindow(centerPos) {
      const N = SONGS.length;
      if (N === 0) return;
      const center = Math.max(0, Math.min(N - 1, Math.round(centerPos)));
      const newMin = Math.max(0, center - QUEUE_RADIUS);
      const newMax = Math.min(N - 1, center + QUEUE_RADIUS);
      if (newMin === renderedMin && newMax === renderedMax) return;
      renderedMin = newMin;
      renderedMax = newMax;
      queueItems.forEach((item, i) => {
        if (i < newMin || i > newMax) removeQueueItem(i, item);
      });
      pendingBuilds = [];
      for (let i = newMin; i <= newMax; i++) {
        if (!queueItems.has(i)) pendingBuilds.push(i);
      }
      pendingBuilds.sort((a, b) => Math.abs(a - center) - Math.abs(b - center));
    }

    // animate 每帧开头调用：最多补建一张，避免批量纹理上传挤占手势帧。
    // 落片编排期间暂停补建：远跳吸附后 target 附近的空槽会集中在此补建，每张纹理的
    // GPU 上传都是同步提交，直接撕裂落片动画的帧预算（实测比优化前更卡）。空槽有
    // 判空不渲染、落片注意力在唱机上，仪式结束后（640ms）再分帧补齐即可
    function flushPendingBuilds() {
      if (state.ceremonyActive) return;
      if (isPointerDown && pendingBuilds.length &&
          Math.abs(pendingBuilds[0] - state.scrollPosition) > 3.3 * state.cameraZoom + 1) return;
      let built = 0;
      while (pendingBuilds.length && built < 1) {
        const i = pendingBuilds.shift();
        if (!queueItems.has(i) && SONGS[i]) {
          queueItems.set(i, buildQueueItem(i));
          built++;
        }
      }
    }

    // 独立过渡黑胶唱片（与转盘上的黑胶尺寸一致 1.19）；初始无贴图，落片时赋目标纹理
    const transitionMat = new THREE.MeshLambertMaterial({
      color: 0x141312
    });
    const transitionRecord = new THREE.Mesh(
      new THREE.CylinderGeometry(1.19, 1.19, 0.024, 96),
      transitionMat
    );
    transitionRecord.visible = false;
    transitionRecord.castShadow = true;
    scene.add(transitionRecord);

    // 落片起点空间状态缓存（世界坐标 + 世界四元数 + 起始缩放）
    const dropStartPos = new THREE.Vector3();
    const dropStartQuat = new THREE.Quaternion();
    let dropStartScale = 1.0;
    const tempTargetPos = new THREE.Vector3();
    const tempTargetQuat = new THREE.Quaternion();
    const tempUpVec = new THREE.Vector3();
    let ceremonyLanded = false;

    /********************************************************************
     * 7. 自然流畅的落片仪式时间线与 3D 实体按钮/唱臂交互控制
     ********************************************************************/
    function triggerPlayCeremony(targetSongId, clientX, clientY, fromSync = false) {
      // 仪式进行中重复点击同一张碟（用户见落针延迟时连点数下的常见习惯）：
      // 队列还在滑行，每次重启仪式的起飞碟位置都不同，视觉上变成「连续落下
      // 多张不同的碟」——同目标直接忽略，编排继续
      if (state.ceremonyActive && targetSongId === state.droppingSongId) {
        debugLog("ceremony duplicate tap ignored->" + targetSongId);
        return;
      }

      state.transitionToken += 1;
      debugLog("ceremony->" + targetSongId + (fromSync ? " sync" : " user") + " prev=" + state.playingSongId);
      ceremonyStartAt = performance.now();
      ceremonyLanded = false;

      // 音频先动：立即通知原生切歌（原生 playAt；外部对位 fromSync 时不再回抛，避免循环）
      if (!fromSync && window.VinylBridge) {
        try { window.VinylBridge.onSelectSong(targetSongId); } catch (e) {}
      }

      // 远跳吸附：快速滑动后远距离选歌（实测 |d| 可达 45 张），目标碟摆在队列窗口
      // 极边缘（x=±40+），直接落片会从屏幕外横穿整个正在反向滚动的队列飞到唱机——
      // 多张碟片掠过视野，看起来像「连续落下多张错误的碟，最后一张才正确」。
      // 先把滚动位置吸附到目标碟居中（队列瞬跳一次，被随后的镜头过渡掩盖），
      // 落片永远从邻近位置飞来
      // 远跳吸附：点击时队列因惯性滑行尚未到位（|d| 常见 2-5 张）或快速滑动后
      // 远距离选歌（实测可达 45 张），目标碟偏离队列中心——落片会从侧边/屏幕外
      // 横穿整个滑行中的队列飞到唱机。先把滚动位置吸附到目标碟居中（队列瞬跳
      // 一次，被随后的镜头过渡掩盖），落片永远从正前方位置飞来
      const jumpDist = Math.abs(targetSongId - state.scrollPosition);
      if (jumpDist > 1.2) {
        state.scrollPosition = targetSongId;
        state.scrollVelocity = 0;
        state.scrollTarget = targetSongId;
        // 丢弃滑动路径上残留的远处待建槽位（吸附后已无意义；窗口滑回时
        // ensureQueueWindow 会对空槽重新登记）
        pendingBuilds = pendingBuilds.filter(i => Math.abs(i - targetSongId) <= 12);
        ensureQueueWindow(targetSongId);
        // 目标碟若在分帧队列里还没建出，立即单建并摆到中心
        if (!queueItems.has(targetSongId) && SONGS[targetSongId]) {
          const it0 = buildQueueItem(targetSongId);
          queueItems.set(targetSongId, it0);
          it0.group.position.set(0, 0, 0);
          it0.group.rotation.y = 0;
          it0.group.scale.setScalar(1);
          it0.group.updateMatrixWorld();
        }
        debugLog("far-jump snap idx=" + targetSongId + " dist=" + jumpDist.toFixed(0));
      }

      // 记录被选中队列唱片当前的精确世界坐标与姿态四元数，确保无缝衔接
      let sourceItem = queueItems.get(targetSongId);
      if (!sourceItem) {
        debugLog("fallback sourceItem idx=" + targetSongId +
          " window=[" + renderedMin + "," + renderedMax + "]" +
          " scrollPos=" + state.scrollPosition.toFixed(2) +
          " pendingBuilds=" + pendingBuilds.length);
        // 槽位在数值窗口内但分帧补建还没轮到：立即单建这一张（不全量重建——
        // 20 张同步重建会把落片第一帧卡死）
        if (targetSongId >= renderedMin && targetSongId <= renderedMax && SONGS[targetSongId]) {
          sourceItem = buildQueueItem(targetSongId);
          queueItems.set(targetSongId, sourceItem);
        } else {
          // 目标碟片真在已渲染窗口外（通知栏远跳等）：全量重建窗口后重取
          rebuildQueueWindow(targetSongId);
          sourceItem = queueItems.get(targetSongId);
        }
        if (!sourceItem) {
          // 仍失败（空列表等异常）：直接对位，不做飞行
          state.selectedSongId = targetSongId;
          state.playingSongId = targetSongId;
          state.scrollTarget = targetSongId;
          state.scrollPosition = targetSongId;
          updateUI();
          return;
        }
        // 新建组尚未被 animate 摆位：手动放到近似队列位置，避免飞行起点错乱
        const d0 = targetSongId - state.scrollPosition;
        sourceItem.group.position.set(d0 * 0.92, -Math.abs(d0) * 0.1, -Math.abs(d0) * 0.44);
        sourceItem.group.rotation.y = -Math.max(-0.35, Math.min(0.35, d0 * 0.18));
        sourceItem.group.updateMatrixWorld();
      }
      ensureQueueItemTheme(sourceItem, targetSongId);
      sourceItem.disc.getWorldPosition(dropStartPos);
      sourceItem.disc.getWorldQuaternion(dropStartQuat);
      dropStartScale = queueGroup.scale.x * sourceItem.group.scale.x * (1.12 / 1.19);

      state.selectedSongId = targetSongId;
      state.scrollTarget = targetSongId;
      state.droppingSongId = targetSongId;
      state.currentTime = 0;

      // 唱臂先平滑抬起回到安全预备位，等待新唱片落盘（真实音频由原生控制）
      state.audioState = "Paused";

      state.viewState = "Transitioning";
      state.ceremonyActive = true;
      state.ceremonyProgress = 0;

      // 立即按压反馈与音效
      triggerFeedbackPulse(clientX, clientY, 12);
      audioEngine.playTick();

      // 飞行先复用队列中已显示的纹理，避免在动画首帧生成/上传大纹理。
      const t = sourceItem.mat.map;
      if (transitionMat.map !== t) {
        transitionMat.map = t;
        transitionMat.color.set(0xffffff);
        transitionMat.needsUpdate = true;
      }
      transitionRecord.visible = true;
      // 落片动画是「暂停态也可能发生」的动画，必须显式拉起渲染循环
      wakeRender();

      updateUI();
    }

    // 最后一帧落盘画出后再收尾，避免定时器先于渲染触发导致唱片跳到终点。
    function finishPlayCeremony() {
      const targetSongId = state.droppingSongId;
      const token = state.transitionToken;
      const landingTexture = transitionMat.map;
      transitionRecord.visible = false;
      renderer.shadowMap.needsUpdate = true;
      state.ceremonyActive = false;
      state.droppingSongId = -1;
      state.viewState = "PlayingView";
      flushDeferredEvictions();
      flushPendingCovers();
      if (pendingSyncIdx >= 0 && pendingSyncIdx !== state.playingSongId) {
        const target = pendingSyncIdx;
        pendingSyncIdx = -1;
        triggerPlayCeremony(target, null, null, true);
        return;
      }
      pendingSyncIdx = -1;
      state.audioState = "Playing";
      audioEngine.playStylusDropAndBriefCrackle();
      triggerFeedbackPulse(null, null, 8);
      updateUI();

      // 落片后恢复主碟高清纹理；若已切歌或封面更新，则不覆盖新状态。
      setTimeout(() => {
        if (state.transitionToken !== token || state.ceremonyActive ||
            state.playingSongId !== targetSongId || activeVinylMat.map !== landingTexture) return;
        activeVinylMat.map = textureFor(targetSongId, true);
        activeVinylMat.needsUpdate = true;
        wakeRender();
      }, 0);
    }

    // 统一播放/暂停切换逻辑（供 3D 实体圆形按钮、3D 唱臂、底部现代按钮共同调用）
    function togglePlayPause(sourceType, clientX, clientY) {
      // 如果当前正在预览另一张尚未落片的唱片，触发落片播放
      if (state.selectedSongId !== state.playingSongId) {
        if (sourceType === "physicalButton") {
          state.physicalBtnVelocity = -0.95; // 按钮下压物理冲量
          audioEngine.playMechanicalSwitch(true);
        }
        triggerPlayCeremony(state.selectedSongId, clientX, clientY);
        return;
      }

      triggerFeedbackPulse(clientX, clientY, 14);

      if (sourceType === "physicalButton") {
        // 触发 3D 实体圆形按钮下压与回弹物理动画
        state.physicalBtnVelocity = -0.95;
        audioEngine.playMechanicalSwitch(state.audioState !== "Playing");
      }

      if (state.audioState === "Playing" || state.audioState === "Buffering") {
        state.audioState = "Paused";
        // 真实音频暂停走原生（原型和弦模拟已割除）
        if (window.VinylBridge) { try { window.VinylBridge.onTogglePlay(); } catch (e) {} }
        if (sourceType === "tonearm") {
          audioEngine.playTonearmLiftSound();
        }
      } else {
        if (state.viewState === "Browse") {
          state.viewState = "PlayingView";
        }
        state.audioState = "Playing";
        audioEngine.playStylusDropAndBriefCrackle();
        if (window.VinylBridge) { try { window.VinylBridge.onTogglePlay(); } catch (e) {} }
      }
      updateUI();
    }

    function setViewMode(targetMode) {
      if (state.ceremonyActive) {
        debugLog("WARN: setViewMode SKIP (ceremony 悬挂)", true);
        return;
      }
      state.viewState = targetMode;
      if (targetMode === "PlayingView") {
        state.selectedSongId = state.playingSongId;
        state.scrollTarget = state.playingSongId;
      }
      audioEngine.playTick();
      updateUI();
    }

    function normalizeAngle(angle) {
      return Math.atan2(Math.sin(angle), Math.cos(angle));
    }

    // 双击复位的 home 朝向：机身播放按钮局部坐标 (x=-1.36, z=1.06)，方位角
    // atan2(x,z)≈-52°；rotation.y 每加 α，点方位角同步 +α，故 home yaw 取
    // -atan2(x,z)≈+52°——按钮正好转到 +z 正前方正对用户，即「正面与侧面
    // 之间约 45°」的最佳观赏角
    const TURNTABLE_HOME_YAW = -Math.atan2(-1.36, 1.06); // ≈ +0.909 rad ≈ 52°
    // 进页面直接落在 home 朝向：与双击复位的最佳观赏角一致，不做入场甩头
    state.turntableYaw = TURNTABLE_HOME_YAW;

    function triggerTurntableReset(clientX, clientY) {
      state.yawVelocity = 0;
      state.isResettingYaw = true;
      audioEngine.playTick();
      triggerFeedbackPulse(clientX, clientY, 10);
    }

    /********************************************************************
     * 8. UI 层更新与底部控制舱收起/展开逻辑
     ********************************************************************/
    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
    }

    let uiEls = null;
    let lastPlayIcon = "";
    function updateUI() {
      if (!SONGS.length) return;
      const isPreviewDifferent = state.selectedSongId !== state.playingSongId;
      const displayedSong = SONGS[state.selectedSongId];
      const playingSong = SONGS[state.playingSongId];
      if (!uiEls) {
        uiEls = {
          title: document.getElementById("song-title"),
          artist: document.getElementById("song-artist"),
          playBtn: document.getElementById("btn-play"),
          playSvg: document.getElementById("icon-play-svg"),
          viewLabel: document.getElementById("view-mode-label"),
          total: document.getElementById("time-total"),
          inspector: document.getElementById("inspector-drawer"),
          debugView: document.getElementById("dbg-view"),
          debugAudio: document.getElementById("dbg-audio"),
          debugIds: document.getElementById("dbg-ids")
        };
      }
      const setText = (el, value) => { if (el.textContent !== value) el.textContent = value; };
      setText(uiEls.title, displayedSong.title);
      setText(uiEls.artist, displayedSong.artist);
      uiEls.playBtn.classList.toggle("drop-mode", isPreviewDifferent);
      setText(uiEls.viewLabel, state.viewState === "Browse" ? "选歌队列 · 点击收起" : "沉浸黑胶 · 播放态");
      const icon = isPreviewDifferent ? "drop" : (state.audioState !== "Paused" ? "pause" : "play");
      if (icon !== lastPlayIcon) {
        uiEls.playSvg.innerHTML = icon === "drop"
          ? `<path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/>`
          : icon === "pause"
            ? `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`
            : `<path d="M8 5v14l11-7z"/>`;
        lastPlayIcon = icon;
      }
      setText(uiEls.total, formatTime(playingSong.duration));
      updateProgressDOM();
      if (uiEls.inspector.classList.contains("open")) {
        setText(uiEls.debugView, state.viewState);
        setText(uiEls.debugAudio, state.audioState);
        setText(uiEls.debugIds, `#${state.selectedSongId} / #${state.playingSongId}`);
      }
    }

    // ===== 黑胶页歌词（原生推内嵌/缓存歌词，随播放进度高亮） =====
    const lyricState = { synced: false, lines: [], index: -2, on: false };
    try { lyricState.on = localStorage.getItem("vinyl_lyrics_on") === "1"; } catch (e) {}

    function setLyricLine(el, text) {
      const t = text || "";
      if (el.textContent !== t) el.textContent = t;
      el.style.display = t ? "-webkit-box" : "none";
    }

    // 线性推进找当前行：从上次位置向两侧收敛，seek 大跳也能快速定位
    function lyricIndexFor(ms) {
      const lines = lyricState.lines;
      if (!lines.length) return -1;
      let i = lyricState.index >= 0 && lyricState.index < lines.length ? lyricState.index : 0;
      while (i > 0 && lines[i].t > ms) i--;
      while (i < lines.length - 1 && lines[i + 1].t <= ms) i++;
      return lines[0].t > ms ? -1 : i;
    }

    function renderLyrics(force) {
      const panel = document.getElementById("vinyl-lyrics");
      if (!panel) return;
      const active = lyricState.on && lyricState.lines.length > 0;
      if (panel.classList.contains("visible") !== active) panel.classList.toggle("visible", active);
      if (!active) return;
      const prevEl = document.getElementById("lyric-prev");
      const curEl = document.getElementById("lyric-cur");
      const trEl = document.getElementById("lyric-cur-tr");
      const nextEl = document.getElementById("lyric-next");
      if (!lyricState.synced) {
        // 纯文本歌词：无时间轴，静态展示头两行
        setLyricLine(prevEl, "");
        setLyricLine(curEl, lyricState.lines[0] ? lyricState.lines[0].text : "");
        setLyricLine(trEl, "");
        setLyricLine(nextEl, lyricState.lines[1] ? lyricState.lines[1].text : "");
        return;
      }
      const ms = state.currentTime * 1000;
      const idx = lyricIndexFor(ms);
      if (!force && idx === lyricState.index) return;
      lyricState.index = idx;
      const line = idx >= 0 ? lyricState.lines[idx] : null;
      setLyricLine(prevEl, idx > 0 ? lyricState.lines[idx - 1].text : "");
      setLyricLine(curEl, line ? line.text : "· · ·");
      setLyricLine(trEl, line && line.tr ? line.tr : "");
      setLyricLine(nextEl, line && lyricState.lines[idx + 1] ? lyricState.lines[idx + 1].text : "");
    }

    // 进度条 DOM 更新：元素引用缓存（避免每帧 getElementById），每帧刷新保证
    // 进度与歌词推进的流畅度
    let progressDomEls = null;
    function updateProgressDOM() {
      // 落片编排期间跳过 DOM 写：进度由编排时间线驱动、收尾时统一刷新，
      // 每帧 textContent/样式写会在编排关键帧上叠加主线程成本
      if (state.ceremonyActive) return;
      const playingSong = SONGS[state.playingSongId];
      if (!playingSong) return;
      const ratio = Math.min(1, Math.max(0, state.currentTime / playingSong.duration));
      if (!progressDomEls) {
        progressDomEls = {
          time: document.getElementById("time-current"),
          fill: document.getElementById("progress-fill"),
          thumb: document.getElementById("progress-thumb")
        };
      }
      const time = formatTime(state.currentTime);
      if (progressDomEls.time.textContent !== time) progressDomEls.time.textContent = time;
      if (!state.deckCollapsed) {
        progressDomEls.fill.style.width = `${ratio * 100}%`;
        progressDomEls.thumb.style.left = `${ratio * 100}%`;
      }
      renderLyrics(false);
    }

    // 音量 UI 已移除（媒体音量交给系统侧键/通知栏）；state.volume/isMuted 仍保留，
    // 供原生推送与音效轨增益（audioEngine.updateVolume）使用

    // 底部控制栏整体收起/展开：手柄已移除，改为垂直手势
    function setDeckCollapsed(collapsed) {
      if (state.deckCollapsed === collapsed) return;
      state.deckCollapsed = collapsed;
      viewportEl.classList.toggle("deck-collapsed", collapsed);
      if (!collapsed) updateProgressDOM();
      audioEngine.playTick();
    }

    // 全屏垂直手势：上滑展开控制舱、下滑收起。识别区域不限底部（扩大到全屏），
    // 仅排除真实交互元素（按钮/滑块/菜单/顶部栏）避免抢占点击；
    // 3D 横滑选歌（dx 主导）与该手势（dy 主导）天然互斥不冲突
    (function () {
      let startY = 0, startX = 0, fired = false, tracking = false;
      const THRESH = 34;
      document.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button, input, .slider-hit-area, .progress-wrapper, .more-menu, .chip-btn, .top-bar, .top-center-pill")) {
          tracking = false;
          return;
        }
        startY = e.clientY; startX = e.clientX;
        fired = false; tracking = true;
      }, { passive: true });
      document.addEventListener("pointermove", (e) => {
        if (!tracking || fired) return;
        const dy = e.clientY - startY;
        const dx = e.clientX - startX;
        if (Math.abs(dy) > THRESH && Math.abs(dy) > Math.abs(dx) * 1.3) {
          fired = true;
          setDeckCollapsed(dy > 0); // 上滑 dy<0 → 展开；下滑 dy>0 → 收起
        }
      }, { passive: true });
      document.addEventListener("pointerup", () => { tracking = false; }, { passive: true });
      document.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });
    })();

    /********************************************************************
     * 9. 3D 射线检测 (Raycaster) 与手势分区交互
     ********************************************************************/
    function getHit3DInteractiveObject(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObjects(interactive3DObjects, false);
      return hits.length > 0 ? hits[0].object.userData.interactiveType : null;
    }

    let pointerZone = null;
    let isPointerDown = false;
    let startX = 0, startY = 0;
    let lastX = 0, lastMoveTime = 0;
    let yawStart = 0, scrollStart = 0;
    let isDraggingHorizontal = false;
    let isInvalidVerticalGesture = false;
    let lastTapUpTime = 0, lastTapX = 0, lastTapY = 0;
    let lastTickIndex = 0;
    let lastQueuePulseAt = 0;
    // 多指/鬼点防护：只跟踪一个活动指针。触屏快速滑动时数字触控板可能把
    // 一根手指拆成 2~3 个触点（鬼点），鬼点会覆盖 startX/startY 导致碟片
    // 跳位，其 pointercancel 还会连带杀掉真手势——这是「转着转着卡死」的主因
    let activePointerId = null;

    canvas.addEventListener("pointerdown", (e) => {
      // 已有活动指针时忽略新触点：鬼点/第二根手指不得污染进行中的手势
      if (isPointerDown && activePointerId !== null && e.pointerId !== activePointerId) {
        debugLog("down ignore id=" + e.pointerId + " (活动 id=" + activePointerId + ")");
        return;
      }
      const rect = canvas.getBoundingClientRect();
      const relY = (e.clientY - rect.top) / rect.height;

      const queueSplitRatio = state.viewState === "Browse" ? 0.65 : 0.42;
      const bottomLimit = state.deckCollapsed ? 0.92 : 0.74;
      if (relY > bottomLimit) return;
      // 播放态把选歌触发区收窄到碟片列表条带（碟片实际占 ~0.27-0.37）：
      // 顶部留白带误拖/误点就会整片切进选歌模式，反馈很突兀。
      // 顶部状态胶囊是独立 HTML 按钮（有自己的点击处理），不依赖此区域
      const queueTopMin = state.viewState === "Browse" ? 0.0 : 0.16;
      if (relY < queueTopMin) return;

      pointerZone = relY <= queueSplitRatio ? "queue" : "turntable";
      isPointerDown = true;
      activePointerId = e.pointerId;
      startX = lastX = e.clientX;
      startY = e.clientY;
      lastMoveTime = performance.now();
      isDraggingHorizontal = false;
      isInvalidVerticalGesture = false;

      if (pointerZone === "turntable") {
        yawStart = state.turntableYaw;
        state.yawVelocity = 0;
        state.isResettingYaw = false;
      } else {
        scrollStart = state.scrollPosition;
        state.scrollVelocity = 0;
        lastTickIndex = Math.round(state.scrollPosition);
      }
      debugLog("down id=" + e.pointerId + " x=" + ((e.clientX - rect.left) / rect.width).toFixed(2) +
        " y=" + relY.toFixed(2) + " zone=" + pointerZone + " " + state.viewState);
      // 卡死检测：down 悬挂 8s 未收到 up/cancel（状态泄漏）
      const guardStamp = ++downGuardSeq;
      setTimeout(() => {
        if (isPointerDown && guardStamp === downGuardSeq) {
          debugLog("WARN: down 悬挂>8s 未释放", true);
        }
      }, 8000);
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener("pointermove", (e) => {
      // 桌面端鼠标悬停在 3D 按钮或唱臂上时显示手型指针
      if (!isPointerDown) {
        const hoverType = getHit3DInteractiveObject(e.clientX, e.clientY);
        canvas.style.cursor = hoverType ? "pointer" : "grab";
        return;
      }

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      const now = performance.now();
      const dt = Math.max(8, now - lastMoveTime) / 1000;
      const stepDx = e.clientX - lastX;
      lastX = e.clientX;
      lastMoveTime = now;

      if (!isDraggingHorizontal && !isInvalidVerticalGesture) {
        // 横向按主导轴归属（斜向拖动不再因竖直分量被卡住）；
        // 只有明显的竖直意图才作废手势——原判定（|dy|>14 即作废）会把
        // 先竖后横的轨迹整段杀掉，表现就是「拖不动、松手重拖才恢复」
        if (Math.abs(dx) > 8 && Math.abs(dx) >= Math.abs(dy)) {
          isDraggingHorizontal = true;
          canvas.style.cursor = "grabbing";
          debugLog("drag-lock " + pointerZone + " dx=" + Math.round(dx) + " dy=" + Math.round(dy));
        } else if (Math.abs(dy) > 24 && Math.abs(dy) >= Math.abs(dx) * 1.8) {
          isInvalidVerticalGesture = true;
          debugLog("WARN: invalid-vertical zone=" + pointerZone + " dx=" + Math.round(dx) + " dy=" + Math.round(dy), true);
          if (pointerZone === "queue" && dy > 26 && state.viewState === "PlayingView") {
            setViewMode("Browse");
          } else if (dy < -28 && state.viewState === "Browse") {
            setViewMode("PlayingView");
          }
          return;
        } else {
          return;
        }
      }

      if (isInvalidVerticalGesture) return;

      if (pointerZone === "turntable") {
        const sensitivity = 0.0082;
        state.turntableYaw = yawStart + dx * sensitivity;
        state.yawVelocity = (stepDx * sensitivity) / dt;
      } else if (pointerZone === "queue") {
        if (state.viewState === "PlayingView") {
          state.viewState = "Browse";
          updateUI();
        }
        const queueSensitivity = 0.0068;
        const rawPos = scrollStart - dx * queueSensitivity;
        const minBound = -0.35, maxBound = SONGS.length - 1 + 0.35;
        state.scrollPosition = Math.max(minBound, Math.min(maxBound, rawPos));
        state.scrollVelocity = (-stepDx * queueSensitivity) / dt;
        ensureQueueWindow(state.scrollPosition);

        const currentRound = Math.max(0, Math.min(SONGS.length - 1, Math.round(state.scrollPosition)));
        if (currentRound !== lastTickIndex) {
          lastTickIndex = currentRound;
          state.selectedSongId = currentRound;
          audioEngine.playTick();
          if (now - lastQueuePulseAt >= 100) {
            lastQueuePulseAt = now;
            triggerFeedbackPulse(e.clientX, e.clientY, 0);
          }
          hapticTick();
          debugLog("tick->" + currentRound);
          updateUI();
        }
      }
    });

    canvas.addEventListener("pointerup", (e) => {
      // 非活动指针的抬起（鬼点/第二根手指）不结算手势
      if (!isPointerDown || (activePointerId !== null && e.pointerId !== activePointerId)) {
        debugLog("up id=" + e.pointerId + " noop");
        return;
      }
      activePointerId = null;
      isPointerDown = false;
      canvas.style.cursor = "grab";
      const now = performance.now();
      const totalMove = Math.hypot(e.clientX - startX, e.clientY - startY);

      if (pointerZone === "turntable") {
        if (!isDraggingHorizontal && !isInvalidVerticalGesture && totalMove < 12) {
          // 优先检测是否点击了 3D 唱机上的实体圆形按钮或 3D 唱臂
          const hit3D = getHit3DInteractiveObject(e.clientX, e.clientY);
          if (hit3D === "turntableButton") {
            togglePlayPause("physicalButton", e.clientX, e.clientY);
            lastTapUpTime = 0;
            pointerZone = null;
            return;
          } else if (hit3D === "tonearm") {
            togglePlayPause("tonearm", e.clientX, e.clientY);
            lastTapUpTime = 0;
            pointerZone = null;
            return;
          }

          // 若点击的是唱机木质机身空白处
          if (state.viewState === "Browse") {
            setViewMode("PlayingView");
            lastTapUpTime = 0;
          } else {
            const tapInterval = now - lastTapUpTime;
            const tapDist = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY);
            if (tapInterval < 320 && tapDist < 30) {
              triggerTurntableReset(e.clientX, e.clientY);
              lastTapUpTime = 0;
            } else {
              lastTapUpTime = now;
              lastTapX = e.clientX;
              lastTapY = e.clientY;
            }
          }
        }
      } else if (pointerZone === "queue") {
        if (isDraggingHorizontal) {
          // 连贯惯性：放宽速度上限、加大预测滑行距离，松手后滑行再缓停吸附
          const clampedVel = Math.max(-18, Math.min(18, state.scrollVelocity));
          const predicted = state.scrollPosition + clampedVel * 0.28;
          const targetIdx = Math.max(0, Math.min(SONGS.length - 1, Math.round(predicted)));
          state.scrollTarget = targetIdx;
          state.selectedSongId = targetIdx;
          debugLog("up zone=" + pointerZone + " v=" + Math.round(state.scrollVelocity) + " tgt=" + targetIdx);
          updateUI();
        } else if (!isInvalidVerticalGesture && totalMove < 12) {
          if (state.viewState === "PlayingView") {
            setViewMode("Browse");
          } else {
            const rect = canvas.getBoundingClientRect();
            const relX = (e.clientX - rect.left) / rect.width - 0.5;
            if (Math.abs(relX) < 0.22) {
              triggerPlayCeremony(state.selectedSongId, e.clientX, e.clientY);
            } else if (relX < -0.22 && state.selectedSongId > 0) {
              state.selectedSongId -= 1;
              state.scrollTarget = state.selectedSongId;
              audioEngine.playTick();
              updateUI();
            } else if (relX > 0.22 && state.selectedSongId < SONGS.length - 1) {
              state.selectedSongId += 1;
              state.scrollTarget = state.selectedSongId;
              audioEngine.playTick();
              updateUI();
            }
          }
        }
      }
      pointerZone = null;
    });

    // 系统中断（手掌误判/边缘手势/多指冲突）会以 pointercancel 收场而不是
    // pointerup：不清理的话「拖拽中」状态永久泄漏；直接停摆的话队列/转盘
    // 会停在半路——用户的「卡死」体感。这里按松手处理，让惯性滑行与吸附继续
    canvas.addEventListener("pointercancel", (e) => {
      const hadDrag = isPointerDown;
      const zone = pointerZone;
      const wasHorizontal = isDraggingHorizontal;
      // 鬼点自己的 cancel 不结算真手势
      if (hadDrag && activePointerId !== null && e.pointerId !== activePointerId) {
        debugLog("cancel id=" + e.pointerId + " 其他指针忽略");
        return;
      }
      if (hadDrag && zone === "queue" && wasHorizontal) {
        const clampedVel = Math.max(-18, Math.min(18, state.scrollVelocity));
        const predicted = state.scrollPosition + clampedVel * 0.28;
        const targetIdx = Math.max(0, Math.min(SONGS.length - 1, Math.round(predicted)));
        state.scrollTarget = targetIdx;
        state.selectedSongId = targetIdx;
        debugLog("WARN: pointercancel id=" + e.pointerId + " -> 惯性接续 tgt=" + targetIdx, true);
        updateUI();
      } else if (hadDrag) {
        // 转盘分支：yawVelocity 保留，animate 循环自会衰减滑行
        debugLog("WARN: pointercancel id=" + e.pointerId + " zone=" + zone, true);
      }
      activePointerId = null;
      isPointerDown = false;
      isDraggingHorizontal = false;
      isInvalidVerticalGesture = false;
      pointerZone = null;
      canvas.style.cursor = "grab";
    });
    // document 级探针：捕获落在 canvas 之外的系统中断（滑杆/按钮上的 cancel），
    // 用于判断中断源是逐指针还是整条流被系统收走
    document.addEventListener("pointercancel", (e) => {
      if (e.target === canvas) return;
      debugLog("doc-cancel id=" + e.pointerId + " t=" + e.pointerType, true);
    }, true);

    /********************************************************************
     * 10. 底部控制面板事件（播放、上下曲、进度拖拽、音量拖拽）
     ********************************************************************/
    document.getElementById("btn-play").addEventListener("click", (e) => {
      togglePlayPause("uiButton", e.clientX, e.clientY);
    });

    document.getElementById("btn-prev").addEventListener("click", (e) => {
      const nextId = (state.selectedSongId - 1 + SONGS.length) % SONGS.length;
      triggerPlayCeremony(nextId, e.clientX, e.clientY);
    });

    document.getElementById("btn-next").addEventListener("click", (e) => {
      const nextId = (state.selectedSongId + 1) % SONGS.length;
      triggerPlayCeremony(nextId, e.clientX, e.clientY);
    });

    // ===== 播放模式按钮：随机 → 列表循环 → 单曲循环 三态循环 =====
    // 图标由原生 syncPlayback 推送驱动（500ms 校准自愈）；点击只上抛请求，
    // 由原生 VM 与主界面同一套三态逻辑切换（洗牌袋/队列重排保持一致）
    const MODE_LABELS = { shuffle: "随机播放", repeat_all: "列表循环", repeat_one: "单曲循环" };
    const MODE_NEXT = { shuffle: "repeat_all", repeat_all: "repeat_one", repeat_one: "shuffle" };

    function updateModeBtn() {
      const icons = { shuffle: "mode-icon-shuffle", repeat_all: "mode-icon-repeat-all", repeat_one: "mode-icon-repeat-one" };
      Object.keys(icons).forEach((m) => {
        const el = document.getElementById(icons[m]);
        if (el) el.style.display = m === state.playMode ? "" : "none";
      });
      const btn = document.getElementById("btn-mode");
      if (btn) btn.title = "播放模式：" + (MODE_LABELS[state.playMode] || "");
    }

    document.getElementById("btn-mode").addEventListener("click", () => {
      const next = MODE_NEXT[state.playMode] || "repeat_all";
      state.playMode = next;
      updateModeBtn();
      hapticTick();
      try { window.VinylBridge && VinylBridge.onPlayModeRequested(next); } catch (e) {}
    });

    // ===== 右下角三点菜单：队列入口 + 歌词/亮色开关收纳 =====
    const moreMenu = document.getElementById("more-menu");
    function toggleMoreMenu(force) {
      const open = typeof force === "boolean" ? force : !moreMenu.classList.contains("open");
      moreMenu.classList.toggle("open", open);
      if (!open) {
        document.getElementById("theme-options").classList.remove("open");
        document.getElementById("menu-theme").setAttribute("aria-expanded", "false");
      }
      if (open) hapticTick();
    }
    document.getElementById("btn-more").addEventListener("click", (e) => {
      e.stopPropagation();
      toggleMoreMenu();
    });
    // 点外部/滚页面关闭
    document.addEventListener("pointerdown", (e) => {
      if (!moreMenu.classList.contains("open")) return;
      if (moreMenu.contains(e.target) || e.target.closest("#btn-more")) return;
      toggleMoreMenu(false);
    }, true);

    document.getElementById("menu-queue").addEventListener("click", () => {
      toggleMoreMenu(false);
      setViewMode(state.viewState === "Browse" ? "PlayingView" : "Browse");
    });

    // 歌词开关：与视角记忆同一套 localStorage 模式（开关本体收进菜单）
    const lyricToggle = document.getElementById("toggle-lyrics");
    lyricToggle.classList.toggle("on", lyricState.on);
    document.getElementById("menu-lyrics").addEventListener("click", () => {
      lyricState.on = !lyricState.on;
      lyricToggle.classList.toggle("on", lyricState.on);
      try { localStorage.setItem("vinyl_lyrics_on", lyricState.on ? "1" : "0"); } catch (e) {}
      lyricState.index = -2;
      renderLyrics(true);
      hapticTick();
    });

    // 近/远视角切换：右上角金色放大镜（远视角显示「+」点它放大回来 / 近视角显示「−」点它拉远）
    // 与三点菜单「远视角」开关双入口，状态双向同步；选择随 WebView 持久化
    function updateZoomUI() {
      const zoomedOut = state.cameraZoom > 1.2;
      document.getElementById("zoom-in-icon").style.display = zoomedOut ? "" : "none";
      document.getElementById("zoom-out-icon").style.display = zoomedOut ? "none" : "";
      document.getElementById("toggle-zoom").classList.toggle("on", zoomedOut);
      document.getElementById("btn-zoom").title = zoomedOut ? "回到近视角" : "拉远视角";
    }

    function setCameraZoom(z) {
      state.cameraZoom = z;
      // 记住近/远视角，下次进页恢复（domStorage 已开启，随 WebView 持久化）
      try { localStorage.setItem("vinyl_camera_zoom", String(z)); } catch (e) {}
      updateZoomUI();
    }

    try {
      const savedZoom = parseFloat(localStorage.getItem("vinyl_camera_zoom"));
      if (savedZoom === 1.5 || savedZoom === 1.0) state.cameraZoom = savedZoom;
    } catch (e) {}
    updateZoomUI();

    document.getElementById("btn-zoom").addEventListener("click", () => {
      setCameraZoom(state.cameraZoom > 1.2 ? 1.0 : 1.5);
      hapticTick();
    });
    document.getElementById("menu-zoom").addEventListener("click", () => {
      setCameraZoom(state.cameraZoom > 1.2 ? 1.0 : 1.5);
      hapticTick();
    });

    // 右上角按钮空闲渐隐：任何触摸（切歌/拖动/点按）立即渐显，无操作 3s 渐隐到
    // 幽灵态（opacity 0.07，触摸区域保留仍可点）——平时不抢视觉，界面保持干净
    const zoomBtnEl = document.getElementById("btn-zoom");
    let zoomIdleTimer = null;
    let zoomLastActivity = 0;
    function checkZoomIdle() {
      zoomIdleTimer = null;
      const remaining = 3000 - (performance.now() - zoomLastActivity);
      if (remaining > 0) zoomIdleTimer = setTimeout(checkZoomIdle, remaining);
      else zoomBtnEl.classList.add("dimmed");
    }
    function wakeZoomBtn() {
      zoomLastActivity = performance.now();
      if (zoomBtnEl.classList.contains("dimmed")) zoomBtnEl.classList.remove("dimmed");
      if (!zoomIdleTimer) zoomIdleTimer = setTimeout(checkZoomIdle, 3000);
    }
    document.addEventListener("pointerdown", wakeZoomBtn, { capture: true, passive: true });
    document.addEventListener("pointermove", wakeZoomBtn, { capture: true, passive: true });
    wakeZoomBtn(); // 进页先显示，3 秒后无操作自动渐隐

    document.getElementById("btn-view-toggle").addEventListener("click", () => {
      setViewMode(state.viewState === "Browse" ? "PlayingView" : "Browse");
    });

    // 切主题时只立即更新主碟和正在飞行的碟片；队列按可见范围惰性更新。
    function refreshThemeRecords() {
      const fog = themeMode !== "warm-light";
      const variant = currentTextureVariant();
      const changed = variant !== lastAppliedTextureVariant;
      activeVinylMat.fog = fog;
      transitionMat.fog = fog;
      if (changed && SONGS.length) {
        activeVinylMat.map = textureFor(state.playingSongId, true);
        if (state.droppingSongId >= 0) transitionMat.map = textureFor(state.droppingSongId);
      }
      activeVinylMat.needsUpdate = true;
      transitionMat.needsUpdate = true;
      if (changed) {
        // 隐藏槽位会在下次可见时换新图；不让两套大纹理长期占用 GPU 内存。
        const suffix = "@" + lastAppliedTextureVariant;
        songTextures.forEach((texture, key) => {
          if (key.endsWith(suffix)) {
            texture.dispose();
            songTextures.delete(key);
          }
        });
        lastAppliedTextureVariant = variant;
      }
    }

    // 三套主题直接选择；原二态偏好在初始化 themeMode 时兼容读取。
    const themeOptions = document.getElementById("theme-options");
    const themeButton = document.getElementById("menu-theme");
    function applyThemeMode() {
      if (themeMode === "day") {
        document.documentElement.removeAttribute("data-mode");
      } else {
        document.documentElement.setAttribute("data-mode", themeMode);
      }
      document.getElementById("theme-current").textContent = THEME_LABELS[themeMode];
      themeOptions.querySelectorAll(".theme-option").forEach((option) => {
        option.setAttribute("aria-pressed", String(option.dataset.theme === themeMode));
      });
      applyBackdropMode(themeMode);
      refreshThemeRecords();
    }
    applyThemeMode();
    themeButton.addEventListener("click", () => {
      const open = themeOptions.classList.toggle("open");
      themeButton.setAttribute("aria-expanded", String(open));
      hapticTick();
    });
    themeOptions.querySelectorAll(".theme-option").forEach((option) => {
      option.addEventListener("click", () => {
        const selected = option.dataset.theme;
        if (!Object.prototype.hasOwnProperty.call(THEME_LABELS, selected)) return;
        themeMode = selected;
        try {
          localStorage.setItem("vinyl_theme_mode", themeMode);
          // 旧版回退时仍能恢复最近的日间/夜间偏好。
          if (themeMode !== "warm-light") localStorage.setItem("vinyl_theme_light", themeMode === "night" ? "0" : "1");
        } catch (e) {}
        applyThemeMode();
        wakeRender();
        hapticTick();
      });
    });

    document.getElementById("btn-inspector").addEventListener("click", () => {
      document.getElementById("inspector-drawer").classList.toggle("open");
    });

    document.getElementById("btn-sim-buffer").addEventListener("click", () => {
      if (state.audioState === "Buffering") {
        state.audioState = "Playing";
      } else {
        state.audioState = "Buffering";
      }
      updateUI();
    });

    document.getElementById("btn-reset-yaw").addEventListener("click", (e) => {
      triggerTurntableReset(e.clientX, e.clientY);
    });

    // 进度条拖拽
    const progressHitArea = document.getElementById("progress-hit-area");
    let isScrubbingProgress = false;

    function seekByClientX(clientX) {
      const rect = progressHitArea.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      state.currentTime = ratio * SONGS[state.playingSongId].duration;
      updateProgressDOM();
    }

    progressHitArea.addEventListener("pointerdown", (e) => {
      isScrubbingProgress = true;
      progressHitArea.classList.add("dragging");
      seekByClientX(e.clientX);
      progressHitArea.setPointerCapture(e.pointerId);
    });
    progressHitArea.addEventListener("pointermove", (e) => {
      if (isScrubbingProgress) seekByClientX(e.clientX);
    });
    progressHitArea.addEventListener("pointerup", () => {
      if (!isScrubbingProgress) return;
      isScrubbingProgress = false;
      progressHitArea.classList.remove("dragging");
      audioEngine.playTick();
      // 拖动结束才把最终落点交给原生 seek（拖动中由本地预览）
      if (window.VinylBridge) {
        try { window.VinylBridge.onSeek(state.currentTime); } catch (e) {}
      }
    });

    // 音量滑块与静音按钮已按需求移除，无对应交互逻辑

    /********************************************************************
     * 11. 主渲染循环（物理弹簧按键、三段式自然抛物线落片、唱臂起落、呼吸感）
     ********************************************************************/
    let lastViewportW = -1, lastViewportH = -1;
    // onResize 在脚本末尾会被同步调用一次，那时渲染循环的状态变量尚未初始化
    // （let/const 处于 TDZ），用这个就绪标记避免首次调用抛 ReferenceError
    let renderLoopReady = false;
    let cameraBaseZ = 8.2; // 拉远倍率的基础距离（由视口宽高比决定），实际 z = 基础 × cameraZoom
    function onResize() {
      const w = viewportEl.clientWidth;
      const h = viewportEl.clientHeight;
      // 布局未就绪（AndroidView 组合早于 WebView 布局）：跳过，等帧检查再试，
      // 避免把 canvas 内联尺寸设成 0 导致渲染面积丢失
      if (w <= 0 || h <= 0) return;
      // 缩放/旋转/跨屏（DPR 变化）时重取像素比，再按新比值重建 drawing buffer
      const dpr = renderDpr();
      const sizeChanged = w !== lastViewportW || h !== lastViewportH;
      const ratioChanged = Math.abs(renderer.getPixelRatio() - dpr) > 1e-3;
      if (!sizeChanged && !ratioChanged) return;
      if (ratioChanged) renderer.setPixelRatio(dpr);
      if (sizeChanged) renderer.setSize(w, h);
      camera.aspect = w / h;
      cameraBaseZ = (w / h < 0.5) ? 8.6 : 8.2;
      camera.updateProjectionMatrix();
      lastViewportW = w;
      lastViewportH = h;
      // 尺寸变化会重建 drawing buffer（内容被清空），暂停态循环已停时
      // 必须补一帧，否则旋转屏幕后画面会黑一下。
      // 首次同步调用 onResize 时渲染循环的状态变量还没初始化（TDZ），用就绪标记跳过
      if (renderLoopReady) wakeRender();
    }
    window.addEventListener("resize", onResize);
    if (typeof ResizeObserver !== "undefined") new ResizeObserver(onResize).observe(viewportEl);
    onResize();

    // 五次平滑缓动函数 (Quintic Smootherstep)
    function smootherstep(t) {
      const x = Math.max(0, Math.min(1, t));
      return x * x * x * (x * (x * 6 - 15) + 10);
    }

    let lastFrameTime = performance.now();

    // ===== 渲染循环开关：不可见 / 暂停静止时真正停下 =====
    // 旧实现 animate 每帧无条件 requestAnimationFrame：App 退后台、播放暂停、
    // 甚至页面被遮住时仍在空转渲染，白烧 GPU/主线程（卡顿成因之一）。
    // 这里把 rAF 做成可停可启：页面可见 && 原生前台 && 还有动画在跑才继续；
    // 暂停且全部弹簧/惯性收敛后连续 12 帧（≈200ms）就 cancelAnimationFrame。
    let rafHandle = 0;
    let loopRunning = false;
    let pageVisible = !document.hidden; // 页面自身可见性（WebView 被遮挡/退后台）
    let nativeVisible = true;           // 原生 Lifecycle 推送（ON_PAUSE → false）
    const pageActive = () => pageVisible && nativeVisible;
    let idleFrames = 0;

    function wakeRender() {
      if (!renderLoopReady) return; // 脚本初始化完成前不启动循环
      idleFrames = 0;
      if (!loopRunning && pageActive()) {
        loopRunning = true;
        lastFrameTime = performance.now();
        rafHandle = requestAnimationFrame(animate);
      }
    }
    function stopRenderLoop() {
      loopRunning = false;
      if (rafHandle) { cancelAnimationFrame(rafHandle); rafHandle = 0; }
    }
    document.addEventListener("visibilitychange", () => {
      pageVisible = !document.hidden;
      if (pageActive()) wakeRender(); else stopRenderLoop();
    });
    // 任意按下（3D 拖拽/选歌/手势）都可能引起画面变化，统一顺带唤醒
    document.addEventListener("pointerdown", wakeRender, { capture: true, passive: true });
    document.addEventListener("wheel", wakeRender, { passive: true });

    // 首帧上报：原生遮罩等这一刻才淡出（3D 引擎初始化的半秒纯黑被盖住）
    let firstFrameSent = false;
    function reportFirstFrame() {
      if (firstFrameSent) return;
      firstFrameSent = true;
      try { window.VinylBridge && VinylBridge.onFirstFrame(); } catch (e) {}
    }

    // ===== 主渲染循环 =====
    // 跟随显示器的 vsync；固定 14ms 门槛在 90Hz 屏上会误降到 45fps。
    // 进度 DOM 写节流时间戳（20Hz）：见 animate 内说明
    let lastProgressDomAt = 0;
    // 调试抽屉在 WebView 内被 display:none 隐藏：缓存引用并只在可见时写，
    // 省掉每帧 getElementById + 对隐藏节点的 textContent 写
    const dbgYawEl = (function () {
      const el = document.getElementById("dbg-yaw");
      return el && el.getClientRects().length ? el : null;
    })();
    // 阴影按需重绘的状态镜像（上一帧值）
    let lastShadowTonearmAngle = 0, lastShadowTonearmLift = 0.085, lastShadowBtnOffset = 0;
    let lastShadowYaw = state.turntableYaw, lastShadowDeckY = -999, lastShadowDeckZ = -999;
    let lastShadowRenderAt = -Infinity;
    // 持续掉帧才调低渲染比例；短暂 GC/封面解码不会触发分辨率变化。
    let frameTimeEma = 16.7, slowFrameMs = 0, stableFrameMs = 0;
    let qualityChangedAt = performance.now();
    function updateRenderQuality(now, frameMs) {
      if (frameMs <= 0 || frameMs > 120) {
        slowFrameMs = stableFrameMs = 0;
        frameTimeEma = 16.7;
        return;
      }
      frameTimeEma += (Math.min(frameMs, 50) - frameTimeEma) * 0.08;
      const elapsed = Math.min(frameMs, 40);
      if (frameTimeEma > 21) {
        slowFrameMs += elapsed;
        stableFrameMs = 0;
      } else if (frameTimeEma < 18.3) {
        stableFrameMs += elapsed;
        slowFrameMs = Math.max(0, slowFrameMs - elapsed * 2);
      } else {
        slowFrameMs = Math.max(0, slowFrameMs - elapsed);
        stableFrameMs = 0;
      }
      if (now - qualityChangedAt < 4000 || state.ceremonyActive || isPointerDown) return;
      const previous = renderDpr();
      if (slowFrameMs >= 2200 && renderScale > .75) {
        renderScale = Math.max(.75, renderScale - .125);
      } else if (stableFrameMs >= 12000 && renderScale < 1) {
        renderScale = Math.min(1, renderScale + .125);
      } else return;
      slowFrameMs = stableFrameMs = 0;
      qualityChangedAt = now;
      if (Math.abs(previous - renderDpr()) > 1e-3) onResize();
    }
    // FPS 探针计数
    let fpsFrameCount = 0, fpsWindowStart = performance.now();

    function animate(now) {
      rafHandle = 0;
      // 页面不可见（退后台/被遮挡）直接收手，不排下一帧
      if (!pageActive()) { loopRunning = false; return; }

      // FPS 探针：rAF 实际执行频率 ≈ 显示帧率（GPU 跑不满时被 vsync 节流），
      // 每秒上抛一次供 logcat 取证（VinylDebug tag）
      fpsFrameCount++;
      if (now - fpsWindowStart >= 1000) {
        debugLog("fps=" + fpsFrameCount);
        fpsFrameCount = 0;
        fpsWindowStart = now;
      }

      // 分帧补齐滚动增补的碟片槽位（每帧最多一张），
      // 同帧内 flush 的碟片会被下方摆位循环直接 placement，不露空槽
      flushPendingBuilds();

      // WebView 布局可能晚于脚本执行且 window resize 不再触发：每帧兜底校准
      // 视口（尺寸没变时开销≈两次属性读取+比较）
      if (viewportEl.clientWidth !== lastViewportW || viewportEl.clientHeight !== lastViewportH) {
        onResize();
      }

      // 歌单未注入前只渲染空场景（原生 onPageFinished 后立刻推数据）；
      // 连续 12 帧仍是空场景就停循环，等 setQueue 唤醒
      if (!SONGS.length) {
        renderer.render(scene, camera);
        reportFirstFrame();
        idleFrames++;
        if (idleFrames > 12) { loopRunning = false; return; }
        rafHandle = requestAnimationFrame(animate);
        return;
      }

      const frameMs = now - lastFrameTime;
      const elapsedDt = Math.min(0.25, Math.max(0, frameMs / 1000));
      const dt = Math.min(0.05, elapsedDt);
      lastFrameTime = now;
      updateRenderQuality(now, frameMs);
      const elapsedSec = now * 0.001;

      // 1. 唱机水平 360° 旋转更新
      if (!isPointerDown || pointerZone !== "turntable") {
        if (state.isResettingYaw) {
          const delta = normalizeAngle(TURNTABLE_HOME_YAW - state.turntableYaw);
          state.turntableYaw += delta * Math.min(1, dt * 11);
          if (Math.abs(delta) < 0.003) {
            state.turntableYaw = TURNTABLE_HOME_YAW;
            state.isResettingYaw = false;
          }
        } else if (Math.abs(state.yawVelocity) > 0.001) {
          state.turntableYaw += state.yawVelocity * dt;
          state.yawVelocity *= Math.pow(0.015, dt);
        }
      }
      turntableYawGroup.rotation.y = state.turntableYaw;
      sheenMesh.rotation.z = -state.turntableYaw * 0.65;

      if (dbgYawEl !== null) {
        const normDeg = ((normalizeAngle(state.turntableYaw) * 180) / Math.PI).toFixed(1);
        dbgYawEl.textContent = `${normDeg}°`;
      }

      // 2. 3D 实体圆形按钮物理弹簧按压与 LED 状态灯环更新
      const springStiffness = 180;
      const springDamping = 16;
      const springForce = -springStiffness * state.physicalBtnOffset - springDamping * state.physicalBtnVelocity;
      state.physicalBtnVelocity += springForce * dt;
      state.physicalBtnOffset += state.physicalBtnVelocity * dt;
      // 限制最大下压深度 -0.046
      const clampedPress = Math.max(-0.048, Math.min(0.01, state.physicalBtnOffset));
      physicalBtnCapMesh.position.y = 0.225 + clampedPress;

      // 实体按钮周围的琥珀光圈：播放态常亮温润，暂停态缓慢呼吸提示可点击
      if (state.audioState === "Playing") {
        btnLedMat.opacity = 0.92;
      } else {
        btnLedMat.opacity = 0.32 + (Math.sin(elapsedSec * 3.2) * 0.5 + 0.5) * 0.48;
      }

      // 3. 唱片队列更新（只处理固定窗口内已创建的槽位）
      if (!isPointerDown || pointerZone !== "queue") {
        const prevRound = Math.round(state.scrollPosition);
        const diff = state.scrollTarget - state.scrollPosition;
        // 追赶放缓（dt*11 → dt*7.5）：吸附段保留滑行余韵，跨卡震动只在滚动进行中触发
        state.scrollPosition += diff * Math.min(1, dt * 7.5);
        state.scrollVelocity *= Math.pow(0.01, dt);
        ensureQueueWindow(state.scrollPosition);
        if (Math.round(state.scrollPosition) !== prevRound && Math.abs(diff) > 0.05) {
          hapticTick();
          debugLog("inertia->" + Math.round(state.scrollPosition));
        }
      }

      const isBrowse = state.viewState === "Browse";
      const targetQueueY = isBrowse ? 0.68 : 2.02;
      const targetQueueZ = isBrowse ? 1.55 : -0.18;
      const targetQueueScale = isBrowse ? 1.0 : 0.55;

      queueGroup.position.y += (targetQueueY - queueGroup.position.y) * Math.min(1, dt * 7.5);
      queueGroup.position.z += (targetQueueZ - queueGroup.position.z) * Math.min(1, dt * 7.5);
      const nextQScale = queueGroup.scale.x + (targetQueueScale - queueGroup.scale.x) * Math.min(1, dt * 7.5);
      queueGroup.scale.setScalar(nextQScale);

      queueItems.forEach((item, i) => {
        const d = i - state.scrollPosition;
        const absD = Math.abs(d);
        // 正在执行落片飞行的原槽位黑胶暂时淡出，避免视觉双影
        const isCurrentlyDropping = state.ceremonyActive && i === state.droppingSongId;
        // 可见窗口随视角倍率扩大：拉远 1.5 倍时两侧多露出约一半的碟片
        item.group.visible = absD <= 3.3 * state.cameraZoom && !isCurrentlyDropping;
        if (!item.group.visible) return;
        ensureQueueItemTheme(item, i);
        requestCoverIfNeeded(i);

        const x = d * 0.92;
        const z = -absD * 0.44;
        const floatY = Math.sin(elapsedSec * 0.9 + i) * 0.012;
        const y = -absD * 0.1 + floatY;

        const scale = Math.max(0.58, 1 - absD * 0.15);
        const opacity = themeMode === "warm-light"
          ? Math.max(0.25, 1 - absD * 0.19)
          : Math.max(0.18, 1 - absD * 0.24);
        const tilt = Math.max(-0.35, Math.min(0.35, d * 0.18)) + Math.max(-0.15, Math.min(0.15, state.scrollVelocity * 0.02));

        item.group.position.set(x, y, z);
        item.group.scale.setScalar(scale);
        item.group.rotation.y = -tilt;
        item.mat.opacity = opacity;

        const targetHalo = absD < 0.25 && isBrowse ? 0.68 : 0;
        item.haloMat.opacity += (targetHalo - item.haloMat.opacity) * Math.min(1, dt * 10);
        item.halo.visible = item.haloMat.opacity > 0.01;
      });

      // 4. 唱机纵向焦点位置（当底部控制栏收起时，唱机自动向屏幕黄金中心微移，增强整体性）
      let targetTurntableY = -0.24;
      if (isBrowse) {
        targetTurntableY = -0.92;
      } else if (state.deckCollapsed) {
        targetTurntableY = -0.04; // 全屏纯净态居中舒展
      }
      const targetTurntableZ = isBrowse ? -0.45 : 0.45;
      turntablePitchGroup.position.y += (targetTurntableY - turntablePitchGroup.position.y) * Math.min(1, dt * 6.5);
      turntablePitchGroup.position.z += (targetTurntableZ - turntablePitchGroup.position.z) * Math.min(1, dt * 6.5);
      turntablePitchGroup.updateMatrixWorld();

      // 5. 【升级点 3】三段式抛物线 + 四元数姿态对齐的自然落片动画
      if (state.ceremonyActive) {
        // 使用绝对时间而非截断后的 dt，掉帧后时间线仍与落盘时机一致。
        state.ceremonyProgress = Math.max(0, (now - ceremonyStartAt) / 640);
        const p = Math.min(1, state.ceremonyProgress);

        if (!ceremonyLanded && p >= 520 / 640) {
          ceremonyLanded = true;
          audioEngine.playPlatterThud();
          state.playingSongId = state.droppingSongId;
          if (activeVinylMat.map !== transitionMat.map) {
            activeVinylMat.map = transitionMat.map;
            activeVinylMat.needsUpdate = true;
          }
        }

        // 实时获取转盘上目标唱片的真实世界坐标与世界四元数（无论唱机正在怎样移动或旋转都能精准追踪）
        activeVinylMesh.getWorldPosition(tempTargetPos);
        activeVinylMesh.getWorldQuaternion(tempTargetQuat);

        // 计算唱机转盘法线方向（用于沿中心主轴垂直气垫下降）
        tempUpVec.set(0, 1, 0).applyQuaternion(tempTargetQuat).normalize();

        // 水平与平面滑翔进度 (0 ~ 0.78 完成水平对准主轴)
        const glideT = smootherstep(p / 0.78);

        // 基础插值位置
        transitionRecord.position.lerpVectors(dropStartPos, tempTargetPos, glideT);

        // 叠加抛物线弧高 + 主轴气垫下落高度
        let liftHeight = 0;
        if (p < 0.78) {
          // 抛物线优雅弧线抽出并悬停在主轴正上方 0.24 单位处
          const arcPhase = p / 0.78;
          liftHeight = Math.sin(arcPhase * Math.PI) * 0.42 + smootherstep(arcPhase) * 0.24;
        } else {
          // 0.78 ~ 1.0：套入中心主轴后，带气垫阻尼平滑垂直落向橡胶垫 (0.24 -> 0)
          const dropPhase = (p - 0.78) / 0.22;
          const easeDrop = 1 - Math.pow(1 - dropPhase, 2.6);
          liftHeight = 0.24 * (1 - easeDrop);
        }
        transitionRecord.position.addScaledVector(tempUpVec, liftHeight);

        // 姿态四元数 Slerp：从队列竖直倾角丝滑翻转为转盘倾斜平面
        const rotT = smootherstep(p / 0.74);
        THREE.Quaternion.slerp(dropStartQuat, tempTargetQuat, transitionRecord.quaternion, rotT);

        // 尺寸平滑匹配至 1.0
        const currentScale = THREE.MathUtils.lerp(dropStartScale, 1.0, glideT);
        transitionRecord.scale.setScalar(currentScale);
      }

      // 6. 真实播放状态驱动转盘转速、唱臂循迹与唱针起落
      const isActuallyPlaying = state.audioState === "Playing";
      const isBuffering = state.audioState === "Buffering";

      // 用户要求放慢：2.45 rad/s ≈ 23 RPM（黑胶标称 33⅓ 的七成），观感更从容
      const targetPlatterSpeed = isActuallyPlaying ? 2.45 : 0;
      state.platterSpeed += (targetPlatterSpeed - state.platterSpeed) * Math.min(1, dt * 6.5);
      platterSpinGroup.rotation.y -= state.platterSpeed * elapsedDt;

      const playingSong = SONGS[state.playingSongId];
      if (isActuallyPlaying && !isScrubbingProgress) {
        // 本地插值平滑推进；真实进度由原生 500ms 校准（播完自动下一首也由原生驱动）
        state.currentTime = Math.min(state.currentTime + elapsedDt, playingSong.duration);
        // DOM 写按 20Hz 节流（50ms）：进度条/歌词每帧改 style/textContent 会持续
        // 触发 style/layout，是播放态主线程开销的大头；20Hz 人眼仍然连续
        if (now - lastProgressDomAt >= 50) {
          lastProgressDomAt = now;
          updateProgressDOM();
        }
      }

      const progressRatio = state.currentTime / playingSong.duration;
      const grooveMicroTrack = isActuallyPlaying ? Math.sin(elapsedSec * 3.8) * 0.0018 : 0;
      const targetArmAngle = (isActuallyPlaying || isBuffering)
        ? 0.37 + progressRatio * 0.14 + grooveMicroTrack
        : 0;
      state.tonearmAngle += (targetArmAngle - state.tonearmAngle) * Math.min(1, dt * 6.5);
      tonearmYawPivot.rotation.y = -state.tonearmAngle;

      // 唱针抬放：Playing 落下 (0)，Buffering 或 Paused 抬起 (0.095 rad)
      const targetLift = isActuallyPlaying ? 0 : 0.095;
      state.tonearmLift += (targetLift - state.tonearmLift) * Math.min(1, dt * 9);
      tonearmLiftPivot.rotation.x = -state.tonearmLift;

      // 视角拉远：z 平滑过渡到 基础距离 × 倍率（呼吸感只动 y，两者不冲突）
      const targetCamZ = cameraBaseZ * state.cameraZoom;
      if (Math.abs(camera.position.z - targetCamZ) > 0.001) {
        camera.position.z += (targetCamZ - camera.position.z) * Math.min(1, dt * 6);
      }

      // 悬浮日志卡死检测：吸附不收敛 / ceremony 悬挂（2s 节流，避免刷屏）
      if (!isPointerDown && SONGS.length &&
          Math.abs(state.scrollTarget - state.scrollPosition) > 0.25) {
        if (now - lastStallWarnAt > 2000) {
          lastStallWarnAt = now;
          debugLog("WARN: 吸附不收敛 tgt=" + state.scrollTarget.toFixed(2) +
            " pos=" + state.scrollPosition.toFixed(2), true);
        }
      } else if (!isPointerDown) {
        lastStallWarnAt = 0;
      }
      if (state.ceremonyActive && now - ceremonyStartAt > 3000 && now - lastStallWarnAt > 2000) {
        lastStallWarnAt = now;
        debugLog("WARN: ceremony 悬挂>3s", true);
      }

      // 7. 播放态克制呼吸感
      if (isActuallyPlaying && state.viewState === "PlayingView") {
        const breath = Math.sin(elapsedSec * (Math.PI * 2 / 9.5));
        camera.position.y = 0.55 + breath * 0.012;
        mainLight.intensity = 1.52 + breath * 0.06;
        rimLight.intensity = 0.55 + breath * 0.08;
      } else {
        camera.position.y += (0.55 - camera.position.y) * Math.min(1, dt * 3);
      }

      // 阴影是额外的整场渲染；运动期间最多约 20 次/秒，物体本身仍每帧更新。
      // 唱臂的微小循迹不重绘阴影，旋转机身和镜头位置变化则仍会对齐。
      const shadowDirty =
        state.ceremonyActive ||
        Math.abs(state.tonearmAngle - lastShadowTonearmAngle) > 0.003 ||
        Math.abs(state.tonearmLift - lastShadowTonearmLift) > 0.002 ||
        Math.abs(state.physicalBtnOffset - lastShadowBtnOffset) > 0.002 ||
        Math.abs(normalizeAngle(state.turntableYaw - lastShadowYaw)) > 0.01 ||
        Math.abs(turntablePitchGroup.position.y - lastShadowDeckY) > 0.005 ||
        Math.abs(turntablePitchGroup.position.z - lastShadowDeckZ) > 0.005;
      if (shadowDirty && now - lastShadowRenderAt >= 50) {
        lastShadowTonearmAngle = state.tonearmAngle;
        lastShadowTonearmLift = state.tonearmLift;
        lastShadowBtnOffset = state.physicalBtnOffset;
        lastShadowYaw = state.turntableYaw;
        lastShadowDeckY = turntablePitchGroup.position.y;
        lastShadowDeckZ = turntablePitchGroup.position.z;
        lastShadowRenderAt = now;
        renderer.shadowMap.needsUpdate = true;
      }

      renderer.render(scene, camera);
      reportFirstFrame();
      if (state.ceremonyActive && state.ceremonyProgress >= 1) finishPlayCeremony();

      // 收敛判定：播放中 / 落片 / 惯性 / 弹簧 / 镜头过渡 任一项还在动就继续；
      // 暂停且全部静止后连续 12 帧（≈200ms）→ 停掉 rAF，静止画面留在 canvas 上
      const stillAnimating =
        isActuallyPlaying || state.ceremonyActive || isPointerDown || state.isResettingYaw ||
        pendingBuilds.length > 0 ||
        Math.abs(state.scrollTarget - state.scrollPosition) > 0.01 ||
        Math.abs(state.yawVelocity) > 0.01 ||
        Math.abs(state.physicalBtnVelocity) > 0.01 ||
        Math.abs(state.physicalBtnOffset) > 0.002 ||
        Math.abs(state.tonearmAngle - targetArmAngle) > 0.002 ||
        Math.abs(state.tonearmLift - targetLift) > 0.002 ||
        Math.abs(camera.position.z - targetCamZ) > 0.002 ||
        Math.abs(turntablePitchGroup.position.z - targetTurntableZ) > 0.01 ||
        Math.abs(queueGroup.position.y - targetQueueY) > 0.01 ||
        Math.abs(turntablePitchGroup.position.y - targetTurntableY) > 0.01;
      if (stillAnimating) {
        idleFrames = 0;
      } else {
        idleFrames++;
      }
      if (idleFrames > 12) {
        loopRunning = false;
        return;
      }
      rafHandle = requestAnimationFrame(animate);
    }

    // WebGL 上下文丢失（GPU 重置/驱动回收）：直接可视化提示，避免无声黑屏
    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      showFatal("WebGL 上下文被系统回收，请退出黑胶模式后重进");
    }, false);

    // 诊断：歌单已注入 3 秒后仍视口异常 / 渲染输出为空，把关键数据画出来定位
    setTimeout(function () {
      // 后台或系统尚未安排首帧时 render.info 为 0，不应误报渲染失败。
      if (!SONGS.length || !pageActive() || !firstFrameSent) return;
      const vw = viewportEl.clientWidth, vh = viewportEl.clientHeight;
      const rect = canvas.getBoundingClientRect();
      if (vw <= 0 || vh <= 0) {
        showFatal("视口尺寸异常: " + vw + "x" + vh +
          " innerH=" + window.innerHeight +
          " docH=" + document.documentElement.clientHeight +
          " canvas=" + Math.round(rect.width) + "x" + Math.round(rect.height) +
          " dpr=" + window.devicePixelRatio);
      } else {
        const info = renderer.info.render;
        if (info.triangles === 0) {
          showFatal("渲染输出为空: triangles=0 calls=" + info.calls +
            " 视口=" + vw + "x" + vh);
        }
      }
    }, 3000);

    updateUI();
    renderLoopReady = true;
    wakeRender();
  </script>
</body>
</html>
